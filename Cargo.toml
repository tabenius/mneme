[package]
name = "ragbaz-mneme"
version = "0.2.1"
edition = "2024"
description = "Local, evidence-oriented session history index and read-only MCP server"
license = "GPL-3.0-or-later"

[[bin]]
name = "mneme"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
eventsource-stream = "0.2"
flate2 = "1"
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rmcp = { version = "3.7", features = ["server", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled", "limits", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
wait-timeout = "0.2"

[profile.release]
lto = "thin"
strip = true
